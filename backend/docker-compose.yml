# P1 本地基建：PostgreSQL 15 + Redis 7
# 国内拉取镜像失败时，需先在 Docker Desktop 配置镜像加速（registry-mirrors）。
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: jda
      POSTGRES_PASSWORD: jda
      POSTGRES_DB: jda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
